# valheim-sync — shared server config.
#
# This file is the thing the group keeps in step. When someone updates the
# modpack in r2modman and re-exports the profile, put the new code here and
# everyone else runs `./valheim-sync sync`.
#
# Machine-specific overrides go in ~/.config/valheim-sync/local.conf instead
# (same syntax), so you never have to edit this file locally.

# r2modman / Thunderstore Mod Manager profile code.
PROFILE_CODE="01a0bf76-3ea1-227f-e18e-25aa29c5b313"

# BepInEx release used as the macOS loader. The profile pins the Windows
# BepInEx pack; macOS needs the official macos-universal build instead, which
# is the one that ships the native libdoorstop.dylib.
BEPINEX_VERSION="5.4.23.5"
BEPINEX_SHA256="01c2ae782eb016dfd6c345a18dbd2dcafffb3d9d318449d6486689f426b4a323"

# Packages in the profile that must not be installed as plugins on macOS.
# denikson-BepInExPack_Valheim is the Windows loader (winhttp.dll + an x86-only
# doorstop); BEPINEX_VERSION above replaces it. Space-separated.
SKIP_PACKAGES="denikson-BepInExPack_Valheim"

# Where Steam put the game. Override in local.conf if yours is on another
# drive or in a Steam library folder.
#GAME_DIR="$HOME/Library/Application Support/Steam/steamapps/common/Valheim"
